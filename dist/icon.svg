
<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0288d1" />
      <stop offset="100%" stop-color="#4338ca" />
    </linearGradient>
    <linearGradient id="wingGradLeft" x1="120" y1="140" x2="250" y2="350" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#e0f2fe" stop-opacity="0.8" />
    </linearGradient>
    <linearGradient id="wingGradRight" x1="392" y1="140" x2="262" y2="350" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#e0f2fe" stop-opacity="0.8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Outer Glow Ring -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="8" />

  <!-- Center Group (Taleen Butterfly & Golden Stars) -->
  <g transform="translate(0, 0)" filter="url(#glow)">
    <!-- Antennas -->
    <path d="M225 145 C225 110, 185 95, 170 120" fill="none" stroke="#fbbf24" stroke-width="12" stroke-linecap="round" />
    <circle cx="165" cy="120" r="10" fill="#fbbf24" />

    <path d="M287 145 C287 110, 327 95, 342 120" fill="none" stroke="#fbbf24" stroke-width="12" stroke-linecap="round" />
    <circle cx="347" cy="120" r="10" fill="#fbbf24" />

    <!-- Upper Left Wing -->
    <path d="M240 220 C170 120, 60 160, 80 270 C95 330, 200 320, 240 260 Z" fill="url(#wingGradLeft)" />
    <!-- Upper Right Wing -->
    <path d="M272 220 C342 120, 452 160, 432 270 C417 330, 312 320, 272 260 Z" fill="url(#wingGradRight)" />

    <!-- Lower Left Wing -->
    <path d="M235 270 C160 290, 100 370, 150 410 C200 440, 235 360, 245 310 Z" fill="#ffffff" fill-opacity="0.75" />
    <!-- Lower Right Wing -->
    <path d="M277 270 C352 290, 412 370, 362 410 C312 440, 277 360, 267 310 Z" fill="#ffffff" fill-opacity="0.75" />

    <!-- Center Body -->
    <ellipse cx="256" cy="270" rx="18" ry="85" fill="#1e1b4b" />
    <ellipse cx="256" cy="225" rx="14" ry="14" fill="#fbbf24" />

    <!-- Sparkle Stars -->
    <path d="M120 180 L125 195 L140 200 L125 205 L120 220 L115 205 L100 200 L115 195 Z" fill="#fbbf24" />
    <path d="M390 180 L395 195 L410 200 L395 205 L390 220 L385 205 L370 200 L385 195 Z" fill="#fbbf24" />
  </g>
</svg>
