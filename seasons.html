<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فصول السنة - ستار فل بالعربي</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background: linear-gradient(135deg, #e8f5e8 0%, #fff3e0 100%);
            min-height: 100vh;
            direction: rtl;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .title {
            font-size: 2.5rem;
            color: #2e7d32;
            margin-bottom: 10px;
        }

        .score {
            font-size: 1.2rem;
            color: #666;
        }

        .game-container {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.1);
            max-width: 800px;
            width: 100%;
        }

        .question {
            text-align: center;
            font-size: 1.5rem;
            color: #333;
            margin-bottom: 30px;
            padding: 20px;
            background: linear-gradient(135deg, #f3e5f5 0%, #e8f5e8 100%);
            border-radius: 15px;
        }

        .seasons-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .season-card {
            background: white;
            border: 3px solid #e0e0e0;
            border-radius: 20px;
            padding: 30px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
        }

        .season-card:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
        }

        .season-card.correct {
            border-color: #4caf50;
            background: linear-gradient(135deg, #e8f5e8 0%, #c8e6c9 100%);
            animation: correctAnswer 0.6s ease;
        }

        .season-card.wrong {
            border-color: #f44336;
            background: linear-gradient(135deg, #ffebee 0%, #ffcdd2 100%);
            animation: wrongAnswer 0.6s ease;
        }

        @keyframes correctAnswer {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1.05); }
        }

        @keyframes wrongAnswer {
            0% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
            100% { transform: translateX(0); }
        }

        .season-icon {
            font-size: 4rem;
            margin-bottom: 15px;
            display: block;
        }

        .season-name {
            font-size: 1.5rem;
            font-weight: 600;
            color: #333;
            margin-bottom: 10px;
        }

        .season-description {
            color: #666;
            font-size: 1rem;
            line-height: 1.5;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 20px;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 25px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Cairo', sans-serif;
        }

        .btn-primary {
            background: linear-gradient(135deg, #4caf50 0%, #388e3c 100%);
            color: white;
        }

        .btn-secondary {
            background: linear-gradient(135deg, #ff8a65 0%, #ff7043 100%);
            color: white;
        }

        .btn:hover {
            transform: scale(1.05);
        }

        .message {
            text-align: center;
            margin-top: 20px;
            font-size: 1.2rem;
            font-weight: 600;
            color: #2e7d32;
        }

        @media (max-width: 768px) {
            .seasons-grid {
                grid-template-columns: 1fr;
            }
            
            .title {
                font-size: 2rem;
            }
            
            .question {
                font-size: 1.2rem;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1 class="title">🌸 فصول السنة</h1>
        <div class="score">النقاط: <span id="score">0</span></div>
    </div>

    <div class="game-container">
        <div class="question" id="question">
            <!-- سيتم عرض السؤال هنا -->
        </div>
        
        <div class="seasons-grid" id="seasonsGrid">
            <div class="season-card" data-season="spring" onclick="selectSeason('spring')">
                <div class="season-icon">🌸</div>
                <div class="season-name">الربيع</div>
                <div class="season-description">فصل الأزهار والنمو</div>
            </div>
            
            <div class="season-card" data-season="summer" onclick="selectSeason('summer')">
                <div class="season-icon">☀️</div>
                <div class="season-name">الصيف</div>
                <div class="season-description">فصل الحر والعطلة</div>
            </div>
            
            <div class="season-card" data-season="autumn" onclick="selectSeason('autumn')">
                <div class="season-icon">🍂</div>
                <div class="season-name">الخريف</div>
                <div class="season-description">فصل تساقط الأوراق</div>
            </div>
            
            <div class="season-card" data-season="winter" onclick="selectSeason('winter')">
                <div class="season-icon">❄️</div>
                <div class="season-name">الشتاء</div>
                <div class="season-description">فصل البرد والمطر</div>
            </div>
        </div>
        
        <div class="controls">
            <button class="btn btn-primary" onclick="nextQuestion()">السؤال التالي</button>
            <button class="btn btn-secondary" onclick="goHome()">العودة للرئيسية</button>
        </div>
        
        <div class="message" id="message"></div>
    </div>

    <script>
        let currentQuestion = 0;
        let score = 0;
        let answered = false;

        // أسئلة فصول السنة
        const questions = [
            {
                question: "في أي فصل تتفتح الأزهار وتنمو النباتات؟",
                answer: "spring",
                explanation: "الربيع هو فصل نمو النباتات وتفتح الأزهار"
            },
            {
                question: "في أي فصل نذهب إلى الشاطئ ونسبح؟",
                answer: "summer",
                explanation: "الصيف هو فصل الحر والسباحة"
            },
            {
                question: "في أي فصل تتساقط أوراق الأشجار؟",
                answer: "autumn",
                explanation: "في الخريف تتساقط أوراق الأشجار وتصبح ملونة"
            },
            {
                question: "في أي فصل يكون الطقس بارداً وقد يتساقط الثلج؟",
                answer: "winter",
                explanation: "الشتاء هو فصل البرد والثلج"
            },
            {
                question: "في أي فصل نحتفل بعيد الأم؟",
                answer: "spring",
                explanation: "عيد الأم يكون في فصل الربيع"
            },
            {
                question: "في أي فصل نأكل البطيخ والمانجو؟",
                answer: "summer",
                explanation: "فواكه الصيف مثل البطيخ والمانجو تنضج في الصيف"
            }
        ];

        // عرض السؤال الحالي
        function showQuestion() {
            if (currentQuestion >= questions.length) {
                showMessage('🎉 أحسنت! لقد أكملت جميع الأسئلة!');
                return;
            }
            
            const question = questions[currentQuestion];
            document.getElementById('question').textContent = question.question;
            
            // إعادة تعيين حالة البطاقات
            const cards = document.querySelectorAll('.season-card');
            cards.forEach(card => {
                card.classList.remove('correct', 'wrong');
            });
            
            answered = false;
        }

        // اختيار فصل
        function selectSeason(season) {
            if (answered) return;
            
            const question = questions[currentQuestion];
            const selectedCard = document.querySelector(`[data-season="${season}"]`);
            
            if (season === question.answer) {
                // إجابة صحيحة
                selectedCard.classList.add('correct');
                score += 10;
                updateScore();
                showMessage('✅ إجابة صحيحة! ' + question.explanation);
            } else {
                // إجابة خاطئة
                selectedCard.classList.add('wrong');
                const correctCard = document.querySelector(`[data-season="${question.answer}"]`);
                setTimeout(() => {
                    correctCard.classList.add('correct');
                }, 500);
                showMessage('❌ إجابة خاطئة. ' + question.explanation);
            }
            
            answered = true;
        }

        // السؤال التالي
        function nextQuestion() {
            currentQuestion++;
            showQuestion();
            document.getElementById('message').textContent = '';
        }

        // تحديث النقاط
        function updateScore() {
            document.getElementById('score').textContent = score;
        }

        // عرض رسالة
        function showMessage(text) {
            document.getElementById('message').textContent = text;
        }

        // العودة للصفحة الرئيسية
        function goHome() {
            window.location.href = '../index.html';
        }

        // بدء اللعبة عند تحميل الصفحة
        window.addEventListener('load', () => {
            showQuestion();
            showMessage('اختر الفصل الصحيح للإجابة على السؤال');
        });
    </script>
</body>
</html>
