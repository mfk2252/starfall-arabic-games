<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient: Rich Taleen Pink / Magenta -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="45%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#831843" />
    </linearGradient>

    <!-- Upper Wings Pink Gradient -->
    <linearGradient id="wingGradLeft" x1="100" y1="120" x2="250" y2="350" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fff1f5" />
      <stop offset="35%" stop-color="#f472b6" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>
    <linearGradient id="wingGradRight" x1="412" y1="120" x2="262" y2="350" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fff1f5" />
      <stop offset="35%" stop-color="#f472b6" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>

    <!-- Inner Wing Details Gradient -->
    <linearGradient id="innerWingLeft" x1="140" y1="160" x2="230" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#fbcfe8" stop-opacity="0.6" />
    </linearGradient>
    <linearGradient id="innerWingRight" x1="372" y1="160" x2="282" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#fbcfe8" stop-opacity="0.6" />
    </linearGradient>

    <!-- Lower Wings Pink Gradient -->
    <linearGradient id="lowerWingLeft" x1="120" y1="280" x2="240" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fce7f3" />
      <stop offset="60%" stop-color="#fb7185" />
      <stop offset="100%" stop-color="#be123c" />
    </linearGradient>
    <linearGradient id="lowerWingRight" x1="392" y1="280" x2="272" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fce7f3" />
      <stop offset="60%" stop-color="#fb7185" />
      <stop offset="100%" stop-color="#be123c" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Outer Glow Ring -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="none" stroke="#ffffff" stroke-opacity="0.3" stroke-width="8" />

  <!-- Center Group (Taleen Pink Butterfly & Golden Stars) -->
  <g filter="url(#glow)">
    <!-- Antennas with Golden Spark -->
    <path d="M230 145 C225 105, 175 90, 160 115" fill="none" stroke="#fbbf24" stroke-width="12" stroke-linecap="round" />
    <circle cx="155" cy="115" r="11" fill="#fef08a" stroke="#f59e0b" stroke-width="3" />

    <path d="M282 145 C287 105, 337 90, 352 115" fill="none" stroke="#fbbf24" stroke-width="12" stroke-linecap="round" />
    <circle cx="357" cy="115" r="11" fill="#fef08a" stroke="#f59e0b" stroke-width="3" />

    <!-- Upper Left Wing -->
    <path d="M242 220 C165 110, 50 155, 75 270 C92 335, 198 325, 242 262 Z" fill="url(#wingGradLeft)" />
    <!-- Upper Left Wing Inner Highlight -->
    <path d="M228 225 C175 145, 95 180, 110 260 C125 305, 195 298, 228 255 Z" fill="url(#innerWingLeft)" />

    <!-- Upper Right Wing -->
    <path d="M270 220 C347 110, 462 155, 437 270 C420 335, 314 325, 270 262 Z" fill="url(#wingGradRight)" />
    <!-- Upper Right Wing Inner Highlight -->
    <path d="M284 225 C337 145, 417 180, 402 260 C387 305, 317 298, 284 255 Z" fill="url(#innerWingRight)" />

    <!-- Lower Left Wing -->
    <path d="M236 270 C155 290, 95 375, 148 415 C200 445, 238 365, 247 312 Z" fill="url(#lowerWingLeft)" />
    <!-- Lower Left Wing Inner Highlight -->
    <path d="M230 285 C175 305, 130 365, 168 395 C205 415, 230 355, 238 318 Z" fill="#ffffff" fill-opacity="0.5" />

    <!-- Lower Right Wing -->
    <path d="M276 270 C357 290, 417 375, 364 415 C312 445, 274 365, 265 312 Z" fill="url(#lowerWingRight)" />
    <!-- Lower Right Wing Inner Highlight -->
    <path d="M282 285 C337 305, 382 365, 344 395 C307 415, 282 355, 274 318 Z" fill="#ffffff" fill-opacity="0.5" />

    <!-- Center Body -->
    <ellipse cx="256" cy="272" rx="17" ry="86" fill="#3b0764" />
    <ellipse cx="256" cy="226" rx="14" ry="14" fill="#fbbf24" stroke="#f59e0b" stroke-width="2" />

    <!-- Magical Sparkle Stars -->
    <path d="M115 175 L120 190 L135 195 L120 200 L115 215 L110 200 L95 195 L110 190 Z" fill="#fef08a" />
    <path d="M395 175 L400 190 L415 195 L400 200 L395 215 L390 200 L375 195 L390 190 Z" fill="#fef08a" />
    <circle cx="205" cy="180" r="4" fill="#ffffff" opacity="0.9" />
    <circle cx="307" cy="180" r="4" fill="#ffffff" opacity="0.9" />
  </g>
</svg>
