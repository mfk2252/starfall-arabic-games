<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطابق الأرقام - ستار فل بالعربي</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background: linear-gradient(135deg, #e3f2fd 0%, #f3e5f5 100%);
            min-height: 100vh;
            direction: rtl;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .title {
            font-size: 2.5rem;
            color: #1976d2;
            margin-bottom: 10px;
        }

        .score {
            font-size: 1.2rem;
            color: #666;
        }

        .game-container {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.1);
            max-width: 600px;
            width: 100%;
        }

        .numbers-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-bottom: 30px;
        }

        .number-card {
            aspect-ratio: 1;
            background: linear-gradient(135deg, #4fc3f7 0%, #29b6f6 100%);
            border: none;
            border-radius: 15px;
            color: white;
            font-size: 2rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .number-card:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .number-card.matched {
            background: linear-gradient(135deg, #81c784 0%, #66bb6a 100%);
            transform: scale(1.1);
        }

        .number-card.flipped {
            background: linear-gradient(135deg, #ffd54f 0%, #ffca28 100%);
            color: #333;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 20px;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 25px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Cairo', sans-serif;
        }

        .btn-primary {
            background: linear-gradient(135deg, #4fc3f7 0%, #29b6f6 100%);
            color: white;
        }

        .btn-secondary {
            background: linear-gradient(135deg, #ff8a65 0%, #ff7043 100%);
            color: white;
        }

        .btn:hover {
            transform: scale(1.05);
        }

        .message {
            text-align: center;
            margin-top: 20px;
            font-size: 1.2rem;
            font-weight: 600;
            color: #4fc3f7;
        }

        @media (max-width: 480px) {
            .title {
                font-size: 2rem;
            }
            
            .numbers-grid {
                grid-template-columns: repeat(3, 1fr);
            }
            
            .number-card {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1 class="title">🔢 تطابق الأرقام</h1>
        <div class="score">النقاط: <span id="score">0</span></div>
    </div>

    <div class="game-container">
        <div class="numbers-grid" id="numbersGrid">
            <!-- سيتم إنشاء البطاقات بواسطة JavaScript -->
        </div>
        
        <div class="controls">
            <button class="btn btn-primary" onclick="startNewGame()">لعبة جديدة</button>
            <button class="btn btn-secondary" onclick="goHome()">العودة للرئيسية</button>
        </div>
        
        <div class="message" id="message"></div>
    </div>

    <script>
        let numbers = [];
        let flippedCards = [];
        let matchedPairs = 0;
        let score = 0;
        let gameStarted = false;

        // إنشاء مجموعة الأرقام (أزواج من 1 إلى 8)
        function createNumbers() {
            numbers = [];
            for (let i = 1; i <= 8; i++) {
                numbers.push(i, i); // إضافة كل رقم مرتين
            }
            // خلط الأرقام عشوائياً
            for (let i = numbers.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [numbers[i], numbers[j]] = [numbers[j], numbers[i]];
            }
        }

        // إنشاء شبكة البطاقات
        function createGrid() {
            const grid = document.getElementById('numbersGrid');
            grid.innerHTML = '';
            
            numbers.forEach((number, index) => {
                const card = document.createElement('button');
                card.className = 'number-card';
                card.dataset.index = index;
                card.dataset.number = number;
                card.textContent = '?';
                card.addEventListener('click', () => flipCard(index));
                grid.appendChild(card);
            });
        }

        // قلب البطاقة
        function flipCard(index) {
            if (!gameStarted) return;
            if (flippedCards.length >= 2) return;
            
            const card = document.querySelector(`[data-index="${index}"]`);
            if (card.classList.contains('flipped') || card.classList.contains('matched')) return;
            
            card.classList.add('flipped');
            card.textContent = card.dataset.number;
            flippedCards.push(index);
            
            if (flippedCards.length === 2) {
                setTimeout(checkMatch, 1000);
            }
        }

        // فحص التطابق
        function checkMatch() {
            const [first, second] = flippedCards;
            const firstCard = document.querySelector(`[data-index="${first}"]`);
            const secondCard = document.querySelector(`[data-index="${second}"]`);
            
            if (firstCard.dataset.number === secondCard.dataset.number) {
                // تطابق!
                firstCard.classList.add('matched');
                secondCard.classList.add('matched');
                matchedPairs++;
                score += 10;
                updateScore();
                
                if (matchedPairs === 8) {
                    showMessage('🎉 أحسنت! لقد أكملت اللعبة!');
                    gameStarted = false;
                }
            } else {
                // لا يوجد تطابق
                firstCard.classList.remove('flipped');
                secondCard.classList.remove('flipped');
                firstCard.textContent = '?';
                secondCard.textContent = '?';
                score = Math.max(0, score - 2);
                updateScore();
            }
            
            flippedCards = [];
        }

        // تحديث النقاط
        function updateScore() {
            document.getElementById('score').textContent = score;
        }

        // عرض رسالة
        function showMessage(text) {
            document.getElementById('message').textContent = text;
            setTimeout(() => {
                document.getElementById('message').textContent = '';
            }, 3000);
        }

        // بدء لعبة جديدة
        function startNewGame() {
            createNumbers();
            createGrid();
            flippedCards = [];
            matchedPairs = 0;
            score = 0;
            gameStarted = true;
            updateScore();
            showMessage('ابحث عن الأرقام المتطابقة!');
        }

        // العودة للصفحة الرئيسية
        function goHome() {
            window.location.href = '../index.html';
        }

        // بدء اللعبة عند تحميل الصفحة
        window.addEventListener('load', startNewGame);
    </script>
</body>
</html>
